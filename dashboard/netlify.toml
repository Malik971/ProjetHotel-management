# ============================================================
# dashboard/netlify.toml
# ------------------------------------------------------------
# Deploiement Netlify du dashboard de demo Pastell.
# Site separe du frontend React principal (hotel-montpellier.netlify.app).
#
# Sur Netlify, configurer le site :
#   Base directory     : dashboard
#   Build command      : (vide, contenu statique pur)
#   Publish directory  : dashboard
# ============================================================

[build]
  publish = "."
  # Pas de commande de build : c'est du HTML/CSS/JS statique.

[build.environment]
  # Variables injectees au moment du deploy.
  # Voir dashboard/config.js qui les lit via une convention SPRINGHOTEL_*.
  # Defaut en clair ici ; surcharger via le panneau Netlify "Site settings -> Environment".
  SPRINGHOTEL_BACKEND_URL = "https://springhotel-backend.onrender.com"
  SPRINGHOTEL_MOCK_URL = "https://springhotel-pastell-mock.onrender.com"

# Headers HTTP : CSP minimaliste, cache court sur les fichiers de config
# pour pouvoir basculer rapidement les URLs sans redeploy.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Redirection optionnelle : /status -> /status.html pour des URLs propres.
[[redirects]]
  from = "/status"
  to = "/status.html"
  status = 200
