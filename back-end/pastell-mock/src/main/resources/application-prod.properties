# ============================================================
# pastell-mock / application-prod.properties
# ------------------------------------------------------------
# Profil "prod" du mock Pastell, active automatiquement par Render
# (SPRING_PROFILES_ACTIVE=prod sur ce service).
#
# Ce fichier n'existait pas avant le Lot 6. En dev local, le mock se
# contente du fichier de base application.properties. Pour la mise en
# ligne sur Render, ce profil ajoute :
#   - la liaison au PORT injecte par Render
#   - l'activation du mode rotatif (master-secret partage avec sejour-backend)
#   - l'exposition Actuator minimale pour les healthchecks
# ============================================================

# ============================================================
# Port d'ecoute (Render injecte PORT)
# ============================================================
server.port=${PORT:8090}

# ============================================================
# Auth rotative : meme PASTELL_MASTER_SECRET que sejour-backend.
# Sans cette variable, le mock retombe automatiquement sur les credentials
# statiques (PASTELL_MOCK_USERNAME / PASTELL_MOCK_PASSWORD), grace au
# pattern @ConditionalOnProperty dans MockSecurityConfig.
# ============================================================
pastell.mock.master-secret=${PASTELL_MASTER_SECRET}

# Fallback statiques (non utilises en mode rotatif, mais Spring exige
# que les @Value soient resolvables, donc on fournit des valeurs).
pastell.mock.username=${PASTELL_MOCK_USERNAME:unused-in-rotating-mode}
pastell.mock.password=${PASTELL_MOCK_PASSWORD:unused-in-rotating-mode}

# ============================================================
# Logs en prod : INFO partout, format propre.
# ============================================================
logging.level.root=INFO
logging.level.com.example.pastellmock=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# ============================================================
# Observabilite : Spring Boot Actuator
# ------------------------------------------------------------
# Expose health et info uniquement. Pas de details sensibles.
# /actuator/health est anonyme (whitelist dans MockSecurityConfig).
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=pastell-mock
info.app.version=0.0.1-SNAPSHOT
info.app.lot=Lot 6 - mise en ligne
