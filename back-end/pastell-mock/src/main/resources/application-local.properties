# ============================================================
# pastell-mock / application-local.properties
# ------------------------------------------------------------
# Profil "local" : active le mode rotatif sur la machine de dev.
#
# Pourquoi ce fichier existe :
#   application.properties (commun) ne definit PAS pastell.mock.master-secret.
#   Resultat : par defaut, le mock demarre en mode STATIQUE
#   (username/password en clair), ce qui permet aux tests automatises
#   de passer sans dependre d'aucune variable d'environnement.
#
#   Ce profil "local" reintroduit le master-secret pour activer le mode
#   ROTATIF (derivation HMAC-SHA256, rotation quotidienne UTC), identique
#   a ce qui tourne en production. Il sert quand on veut tester en local
#   l'authentification rotative entre sejour-backend et pastell-mock.
#
# Comment l'activer dans IntelliJ :
#   Run/Debug Configurations > PastellMockApplication
#   Champ "Active profiles" : local
#   Conserver la variable d'environnement PASTELL_MASTER_SECRET dans la config.
#
# Comment l'activer en ligne de commande :
#   mvn -pl pastell-mock spring-boot:run -Dspring-boot.run.profiles=local
#   (avec PASTELL_MASTER_SECRET exporte au prealable)
#
# IMPORTANT : la valeur de PASTELL_MASTER_SECRET doit etre IDENTIQUE cote
# sejour-backend, sinon l'authentification entre les deux services echoue.
# Verifier que les deux configs IntelliJ partagent la meme valeur.
#
# Ce profil n'est jamais actif pendant "mvn test" : les tests tournent sans
# profil et restent donc en mode statique, ce qui garantit leur stabilite.
# ============================================================

# Active le mode rotatif. La valeur vient de la variable d'environnement
# injectee par la config de run IntelliJ (ou exportee dans le shell).
# Pas de valeur par defaut ici : si la variable est absente, Spring echoue
# explicitement au demarrage, ce qui est preferable a un demarrage silencieux
# en mauvais mode.
pastell.mock.master-secret=${PASTELL_MASTER_SECRET}