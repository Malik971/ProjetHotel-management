# ============================================================
# application-test.properties
# Emplacement : sejour-backend/src/test/resources/
#
# Profil "test" : configuration alternative utilisee uniquement
# pendant les tests automatises qui chargent un contexte Spring.
#
# Pourquoi ce fichier ?
#   - Permet de lancer "mvn test" sans avoir Docker / PostgreSQL demarre
#   - Indispensable pour la CI (GitHub Actions n'a pas de PostgreSQL)
#   - Tests rapides : H2 en memoire demarre en quelques ms
#   - Pratique standard de l'industrie pour les apps Spring Boot
#
# Activation : via @ActiveProfiles("test") sur les classes de test
#              ou via app.setAdditionalProfiles("test") pour les
#              SpringApplication lances manuellement.
#
# Note : ce profil n'est jamais actif en dev local (sauf si tu
#        l'actives explicitement). Le profil "dev" continue d'utiliser
#        PostgreSQL local via application.properties.
# ============================================================

# ---- Base de donnees H2 en memoire ----
# MODE=PostgreSQL : H2 emule la syntaxe PostgreSQL pour minimiser
#                   les divergences avec la prod (mais pas 100% identique).
# DATABASE_TO_LOWER=TRUE : noms de tables/colonnes en minuscules
#                          (compatible avec les conventions Postgres).
spring.datasource.url=jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- Hibernate ----
# create-drop : Hibernate cree le schema au demarrage et le supprime
#               a la fin. Pas besoin de Flyway en test.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ---- Flyway desactive en test ----
# Pourquoi ? Nos migrations Flyway utilisent une syntaxe PostgreSQL
# (ex. ALTER COLUMN ... DROP NOT NULL dans V3) qui n'est pas 100%
# compatible avec H2. En test, on laisse Hibernate creer le schema
# directement a partir des entites JPA.
spring.flyway.enabled=false

# ---- Mail desactive en test ----
# Empeche tout envoi reel d'email pendant les tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=

# ---- Pastell : laisse desactive par defaut ----
# Les tests qui veulent activer Pastell le font via @TestPropertySource
pastell.enabled=false