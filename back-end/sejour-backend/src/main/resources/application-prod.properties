# ============================================================
# sejour-backend / application-prod.properties
# ------------------------------------------------------------
# Profil "prod", active automatiquement par Render (SPRING_PROFILES_ACTIVE=prod).
# Cette config se superpose a application.properties.
# Toutes les valeurs sensibles passent par des variables d'environnement.
# ============================================================

# ============================================================
# PostgreSQL (Render)
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# Lot 6 : on passe en mode "Flyway gere le schema, Hibernate valide seulement".
# Pourquoi ddl-auto=validate au lieu de update :
#   - Garantit que Hibernate ne touche jamais a la structure de la base.
#   - Toute evolution de schema passe obligatoirement par une migration Flyway,
#     ce qui est tracable, revertible, et coherent entre environnements.
#   - Empeche les "auto-evolutions" silencieuses si une entite Java drift par
#     rapport au schema reel (Hibernate echoue net au demarrage).
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=public

# ============================================================
# Flyway active en prod (Lot 6)
# Migrations V1 a V5 dans src/main/resources/db/migration/
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# defer-datasource-initialization n'a plus de sens avec ddl-auto=validate.
# On le passe a false pour clarte. Hibernate ne creant rien, il n'y a plus
# de "DDL Hibernate / script SQL" a serialiser.
spring.jpa.defer-datasource-initialization=false

# ============================================================
# Port d'ecoute (Render injecte la variable PORT)
# ============================================================
server.port=${PORT:8080}

# ============================================================
# CORS production
# Deux origins autorisees :
#   - le frontend React principal (hotel-montpellier.netlify.app)
#   - le dashboard de demo Pastell (springhotel-pastell-dashboard.netlify.app)
# ============================================================
spring.web.cors.allowed-origins=https://hotel-montpellier.netlify.app,https://springhotel-pastell-dashboard.netlify.app
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ============================================================
# Upload de fichiers
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# Email
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# Pastell (Lot 6 : activation en prod)
# ------------------------------------------------------------
# Mode rotatif via master-secret partage avec le mock.
# La variable PASTELL_MASTER_SECRET doit etre identique sur les deux services.
# ============================================================
pastell.enabled=true
pastell.mode=MOCK
pastell.url=${PASTELL_BASE_URL}
pastell.master-secret=${PASTELL_MASTER_SECRET}
pastell.entite-id=1
pastell.type-dossier=reservation-hoteliere
pastell.timeout-ms=8000
pastell.polling.enabled=true
pastell.polling.interval-ms=30000
pastell.retry.scheduler-enabled=true
pastell.retry.scheduler-interval-ms=300000

# ============================================================
# Mode demo publique (Lot 6)
# ------------------------------------------------------------
# Token requis sur le header X-Demo-Token pour les operations destructives
# (typiquement POST /api/admin/pastell/poll). Defini cote Render via la
# variable DEMO_ADMIN_TOKEN.
# ------------------------------------------------------------
# Rate limit : 10 requetes par IP par fenetre de 60s sur les ecritures.
# Voir DemoRateLimitFilter pour la liste exacte des paths proteges.
# ============================================================
demo.admin-token=${DEMO_ADMIN_TOKEN}
demo.rate-limit.enabled=true
demo.rate-limit.max-requests=10
demo.rate-limit.window-seconds=60
jwt.secret=${JWT_SECRET:}

# ============================================================
# Observabilite : Spring Boot Actuator (Lot 6)
# ------------------------------------------------------------
# Exposition limitee : seulement health, info, metrics.
# health avec show-details=never pour ne rien fuiter sur la base de donnees.
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.health.mail.enabled=false

# Metadonnees /actuator/info pour identifier la version deployee
info.app.name=sejour-backend
info.app.version=0.0.1-SNAPSHOT
info.app.lot=Lot 6 - mise en ligne
