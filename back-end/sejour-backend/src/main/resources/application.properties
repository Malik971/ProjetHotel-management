# ============================================================
# application.properties - PostgreSQL + Flyway + Pastell
# ============================================================

#  Base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

#  JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#  Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#  Profils
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

#  Serveur
server.port=8080

#  CORS
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

#  Upload fichiers
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#  Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=malik97un@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# Integration Pastell (DevRel demo)
# ============================================================
# Desactivee par defaut : l'application demarre et fonctionne
# exactement comme avant, sans aucune dependance a Pastell.
#
# Pour activer en mode mock local (apres le Lot 2) :
#   pastell.enabled=true
#   pastell.mode=MOCK
#   pastell.url=http://localhost:8090
#   pastell.username=sejour
#   pastell.password=${PASTELL_PASSWORD}
#   pastell.entite-id=1
#   pastell.type-dossier=reservation-hoteliere
#
# Pour activer contre une instance reelle (plus tard) :
#   pastell.enabled=true
#   pastell.mode=REAL
#   pastell.url=https://pastell.partenaire.libriciel.fr
#   pastell.username=${PASTELL_LOGIN}
#   pastell.password=${PASTELL_PASSWORD}
#   pastell.entite-id=<id fourni par Libriciel>
# ============================================================
pastell.enabled=false