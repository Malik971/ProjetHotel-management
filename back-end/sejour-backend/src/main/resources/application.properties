# ============================================================
# application.properties - PostgreSQL + Flyway + Pastell
# ============================================================
# IMPORTANT : ce fichier est commite sur Github. Aucun secret
# en clair ici. Toutes les valeurs sensibles sont injectees
# via variables d'environnement (cf. .env.example a la racine
# du module sejour-backend).
#
# Pattern Spring Boot : ${VAR:defaut}
#   - Si la variable d'env VAR est definie, utilise sa valeur
#   - Sinon, utilise la valeur apres le ":"
#
# Cela permet a l'app de demarrer en local meme sans .env,
# avec des defauts raisonnables (postgres/postgres, etc.).
# ============================================================


# ============================================================
# Profil actif
# ============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ============================================================
# Base de donnees PostgreSQL
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hotel_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# ============================================================
# Serveur
# ============================================================
server.port=${SERVER_PORT:8080}


# ============================================================
# CORS
# ============================================================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true


# ============================================================
# Upload fichiers
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ============================================================
# Mail (SMTP Gmail)
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# ============================================================
# Integration Pastell (Lots 1 a 5)
# ============================================================
# Pour activer en local contre le mock pastell-mock :
#
#   1) Demarrer le mock sur le port 8090
#      mvn -pl pastell-mock spring-boot:run
#
#   2) Definir PASTELL_USERNAME et PASTELL_PASSWORD dans .env
#      (memes valeurs que PASTELL_MOCK_USERNAME / PASTELL_MOCK_PASSWORD
#      cote mock, sinon 401 Unauthorized)
#
#   3) Mettre pastell.enabled=true ci-dessous (par defaut false)
#
# Pour activer contre une instance reelle Pastell (Libriciel) :
#   - Garder pastell.enabled=true
#   - Mettre pastell.mode=REAL
#   - Mettre pastell.url vers l'instance Libriciel
# ============================================================
pastell.enabled=true
pastell.mode=${PASTELL_MODE:MOCK}
pastell.url=${PASTELL_URL:http://localhost:8090}
pastell.username=${PASTELL_USERNAME:sejour}
pastell.password=${PASTELL_PASSWORD:sejour-mock-pwd}
pastell.entite-id=${PASTELL_ENTITE_ID:1}
pastell.type-dossier=${PASTELL_TYPE_DOSSIER:reservation-hoteliere}
pastell.timeout-ms=${PASTELL_TIMEOUT_MS:5000}

# Lot 4 - retry
pastell.retry.scheduler-enabled=${PASTELL_RETRY_SCHEDULER_ENABLED:true}
pastell.retry.scheduler-interval-ms=${PASTELL_RETRY_SCHEDULER_INTERVAL_MS:300000}

# Lot 5 - polling descendant
pastell.polling.enabled=${PASTELL_POLLING_ENABLED:true}
pastell.polling.interval-ms=${PASTELL_POLLING_INTERVAL_MS:30000}

# Lot 6 : permet d'activer le mode rotatif en local en exportant PASTELL_MASTER_SECRET
pastell.master-secret=${PASTELL_MASTER_SECRET:}

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.mail.enabled=false

# ============================================================
# JWT (Lot 0)
# ============================================================
# Cle de signature lue depuis la variable d'environnement JWT_SECRET.
# Doit faire au moins 32 caracteres (256 bits) pour HS256.
# Generation conseillee : openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
# Duree de validite d'un token en millisecondes. 86400000 ms = 24 heures.
jwt.expiration-millis=86400000