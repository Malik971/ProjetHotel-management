# ============================================================
# docker-compose.yml - Infrastructure locale SpringHotel
# ============================================================
# Services : PostgreSQL (port 5432) + Keycloak (port 8180)
# Emplacement : a la racine du projet
# ============================================================
# Demarrer :       docker compose up -d
# Arreter :        docker compose down
# Reset complet :  docker compose down -v   (supprime les volumes)
# Logs Keycloak :  docker compose logs -f keycloak
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: hotel_postgres
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: hotel_keycloak
    # start-dev : mode developpement, HTTP autorise, logs verbeux
    # --import-realm : importe les fichiers JSON du repertoire d'import au demarrage
    #                  (seulement si le realm n'existe pas deja)
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      # 8180 -> 8080 : evite le conflit avec sejour-backend (8080) et pastell-mock (8090)
      - "8180:8080"
    volumes:
      # Keycloak cherche les fichiers realm a importer dans ce repertoire
      - ./keycloak:/opt/keycloak/data/import
      # Volume persistant : le realm n'est importe qu'une seule fois (premier demarrage)
      # Pour forcer un reimport propre : docker compose down -v && docker compose up -d
      - hotel_keycloak_data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  hotel_pgdata:
  hotel_keycloak_data: